<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Pacifico&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10" />
  <!-- marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>

  <div id="app">

    <!-- ── Sidebar ──────────────────────────────────────────── -->
    <aside id="sidebar">
      <h1 id="logo">
        <span class="logo-qjm">QJM</span> <span class="logo-dash">-</span> <span class="logo-propelli">Propelli</span>
      </h1>

      <!-- Filter Section (Collapsible on Mobile) -->
      <details class="panel panel-filter" open>
        <summary><h2>Filter</h2></summary>
        <div class="panel-content">


          <label class="checkbox-row" id="label-history">
            <input type="checkbox" id="filter-history" />
            <span class="dot dot-history"></span>
            Full History
          </label>

          <div id="agent-list">
            <!-- Populated dynamically via /api/agents -->
            <p class="hint">Lade Agenten…</p>
          </div>
        </div>
      </details>

      <!-- Send Section (Always visible/Primary) -->
      <details class="panel panel-send" open>
        <summary><h2>Senden</h2></summary>
        <div class="panel-content">
          <div class="send-meta">
            <input id="send-from" type="text" placeholder="Von (z.B. boss)" />
            <input id="send-to"   type="text" placeholder="An (z.B. ea)" />
          </div>
          <textarea id="send-text" rows="3" placeholder="Nachricht…"></textarea>
          <button id="send-btn">Senden ↑</button>
        </div>
      </details>

      <!-- Provider Section -->
      <details class="panel panel-provider" open>
        <summary><h2>Provider</h2></summary>
        <div class="panel-content" id="provider-list">
          <!-- Populated dynamically via JS -->
          <p class="hint">Lade Provider…</p>
        </div>
      </details>

      <!-- LM Studio Section -->
      <details class="panel panel-lmstudio" open>
        <summary>
          <h2>Local LM Studio</h2>
          <div style="display: flex; gap: 4px;">
            <button id="lm-load-btn" class="icon-btn" title="Load Selected Model" style="display: none;">🚀</button>
            <button id="lm-refresh-btn" class="icon-btn" title="Refresh LM Studio Status">↻</button>
          </div>
        </summary>
        <div class="panel-content" id="lmstudio-content">
          <!-- Populated dynamically via JS -->
          <p class="hint">Prüfe Status…</p>
        </div>

        <!-- Vision Model Selector (inside LM Studio panel) -->
        <div class="panel-content" id="vision-model-section" style="border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <span style="font-size: 13px; color: var(--text);">👁️ Vision Model (OCR)</span>
          </div>
          <select id="vision-model-select" style="width: 100%; font-size: 12px; padding: 4px 6px; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px;">
            <option value="">(kein Vision-Modell)</option>
          </select>
          <p class="hint" style="font-size: 10px; margin-top: 4px;">Für Web-OCR (web_ocr_extract Tool)</p>
        </div>
      </details>

      <!-- Ollama Section -->
      <details class="panel panel-ollama" open>
        <summary>
          <h2>Ollama Status</h2>
        </summary>
        <div class="panel-content">
          <div class="ollama-mode-row" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <span style="font-size: 13px; color: var(--text);">Mode:</span>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span id="ollama-mode-cpu-label" class="ollama-toggle-label">CPU</span>
              <label class="switch" title="Toggle between CPU and GPU for Ollama">
                <input type="checkbox" id="ollama-mode-toggle">
                <span class="slider round"></span>
              </label>
              <span id="ollama-mode-gpu-label" class="ollama-toggle-label">GPU</span>
            </div>
          </div>
          <div class="ollama-backend-info" style="display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px;">
            <span>CPU Node: <span id="ollama-cpu-indicator" class="indicator offline">●</span></span>
            <span>GPU Node: <span id="ollama-gpu-indicator" class="indicator offline">●</span></span>
          </div>
        </div>
      </details>
    </aside>

    <!-- ── Main stream ──────────────────────────────────────── -->
    <main id="stream-pane">
      <header id="stream-header">
        <div class="header-left">
          <span id="room-label">Global Stream</span>
        </div>
        <div class="header-right">
          <!-- Context Toggle & Input -->
          <div class="context-container">
            <label class="switch" title="Begrenzt den Chatverlauf im KI-Kontext manuell (Standard: 10)">
              <input type="checkbox" id="context-toggle">
              <span class="slider round"></span>
            </label>
            <span class="autoscroll-label" title="Begrenzt den Chatverlauf im KI-Kontext manuell (Standard: 10)">Context</span>
            <input type="number" id="context-limit-input" min="1" max="100" value="10" disabled 
                   title="Anzahl der Chatnachrichten, die in den LLM-Kontext geladen werden" class="context-input">
          </div>

          <label class="switch" title="Auto-Scroll aktivieren/deaktivieren">
            <input type="checkbox" id="autoscroll-toggle" checked>
            <span class="slider round"></span>
          </label>
          <span class="autoscroll-label" title="Auto-Scroll">Auto-Scroll</span>
          <span id="ib-live-btn"  class="ib-mode-btn" title="IBKR Live Gateway">IBKR-Live</span>
          <span id="ib-paper-btn" class="ib-mode-btn" title="IBKR Paper Gateway">IBKR-Paper</span>
          <span id="conn-indicator" class="indicator offline" title="Live Connection">●</span>
        </div>
      </header>

      <div id="messages"></div>
    </main>

  </div>

  <script src="app.js?v=11"></script>
  <script>
    // Auto-collapse filters on mobile
    if (window.innerWidth <= 768) {
      document.querySelector('.panel-filter').open = false;
    }
  </script>
</body>
</html>
