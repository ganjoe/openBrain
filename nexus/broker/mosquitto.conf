# Mosquitto MQTT Broker — The Nexus
# Internal Docker network only. No TLS needed (air-gapped).

# Standard MQTT listener (for all agents and the Nexus-Service)
listener 1883

# WebSocket listener (reserved for future browser-based clients)
listener 9001
protocol websockets

# Persistence: no message loss on restart
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Logging
log_dest stdout
log_type all

# No authentication required (internal Docker network)
allow_anonymous true
