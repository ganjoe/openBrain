# Open Brain - Local Self-Hosted Stack
# All services run locally, no external API dependencies.
#
# Services:
#   db           - PostgreSQL 17 + pgvector (vector database)
#   postgrest    - REST API layer (Supabase-compatible)
#   studio       - Supabase Studio Web UI
#   ollama       - Embedding model (CPU-only, no GPU)
#   gateway      - Nginx proxy to handle /rest/v1 paths
#   mcp-server   - MCP endpoint for EA agent
#   mcp-cco      - MCP endpoint for CCO agent
#   nexus-broker  - Mosquitto MQTT broker (inter-agent bus)
#   nexus-service - FastAPI service: MQTT logger + REST API (Port 7734)
#   nexus-frontend- Dashboard web UI (Port 7733)

services:
  # --- PostgreSQL with pgvector ---
  db:
    image: pgvector/pgvector:pg17
    container_name: openbrain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - openbrain_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- PostgREST: REST API for the database ---
  postgrest:
    image: postgrest/postgrest
    container_name: openbrain-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
    ports:
      - "3001:3000"

  # --- Supabase Studio Web UI ---
  studio:
    image: supabase/studio:latest
    container_name: openbrain-studio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "Open Brain Local"
      DEFAULT_PROJECT_NAME: "open-brain"
      SUPABASE_URL: http://postgrest:3000
      SUPABASE_PUBLIC_URL: http://${SERVER_IP}:8001
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: "true"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    ports:
      - "3000:3000"

  # --- pg-meta for Studio ---
  meta:
    image: supabase/postgres-meta:v0.96.4
    container_name: openbrain-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: ${POSTGRES_USER}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # --- Ollama: Local embedding model (CPU-only) ---
  # No --gpus flag = CPU-only, won't interfere with LM Studio GPU usage
  ollama:
    image: ollama/ollama
    container_name: openbrain-ollama
    restart: unless-stopped
    volumes:
      - openbrain_ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s

  # --- Gateway: Nginx proxy for /rest/v1 paths ---
  gateway:
    image: nginx:alpine
    container_name: openbrain-gateway
    restart: unless-stopped
    volumes:
      - ./core/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest
    ports:
      - "8001:80"


  # --- The Nexus: MQTT Broker (Mosquitto) ---
  nexus-broker:
    image: eclipse-mosquitto:2
    container_name: openbrain-nexus-broker
    restart: unless-stopped
    volumes:
      - ./nexus/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - openbrain_mqtt:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  # --- The Nexus: FastAPI Service (MQTT logger + REST API) ---
  nexus-service:
    build:
      context: ./nexus/service
      dockerfile: Dockerfile
    container_name: openbrain-nexus-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
      nexus-broker:
        condition: service_started
    environment:
      GATEWAY_URL: http://gateway:80
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      MQTT_BROKER_HOST: nexus-broker
      MQTT_BROKER_PORT: "1883"
    ports:
      - "7734:7734"

  # --- The Nexus: Web Dashboard ---
  nexus-frontend:
    build:
      context: ./nexus/frontend
      dockerfile: Dockerfile
    container_name: openbrain-nexus-frontend
    restart: unless-stopped
    depends_on:
      - nexus-service
    ports:
      - "7733:80"

  # --- MCP Server: AI client endpoint ---
  mcp-server:
    build:
      context: ./agent-ea/mcp-server
      dockerfile: Dockerfile
    container_name: openbrain-mcp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      gateway:
        condition: service_started
    volumes:
      - ./agent-ea/metadata-prompt.txt:/app/metadata-prompt.txt:ro
    environment:
      SUPABASE_URL: http://gateway:80
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: qwen3-embedding:8b
      LM_STUDIO_URL: http://host.docker.internal:1234
      PORT: "8787"
      AGENT_ID: "ea"
      GLOBAL_BRAIN_ACCESS: "true"
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- EA Bot: Executive Agent ---
  agent-ea-bot:
    build:
      context: ./agent-ea/bot
      dockerfile: Dockerfile
    container_name: openbrain-ea-bot
    restart: unless-stopped
    depends_on:
      - nexus-broker
      - mcp-server
    volumes:
      - ./agent-ea/prompt.txt:/app/prompt.txt:ro
      - ./agent-ea/config.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      LM_STUDIO_URL: http://host.docker.internal:1234
      POSTGREST_URL: http://postgrest:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- CCO MCP Server ---
  mcp-cco:
    build:
      context: ./agent-cco/mcp-server
      dockerfile: Dockerfile
    container_name: openbrain-mcp-cco
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      gateway:
        condition: service_started
    volumes:
      - ./agent-cco/metadata-prompt.txt:/app/metadata-prompt.txt:ro
    environment:
      SUPABASE_URL: http://gateway:80
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: qwen3-embedding:8b
      LM_STUDIO_URL: http://host.docker.internal:1234
      PORT: "8788"
      AGENT_ID: "cco"
      GLOBAL_BRAIN_ACCESS: "false"
      X_BEARER_TOKEN: ${X_BEARER_TOKEN}
    ports:
      - "8788:8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- CCO Bot: Chief Communication Officer ---
  agent-cco-bot:
    build:
      context: ./agent-cco/bot
      dockerfile: Dockerfile
    container_name: openbrain-cco-bot
    restart: unless-stopped
    depends_on:
      - nexus-broker
      - mcp-cco
    volumes:
      - ./agent-cco/prompt.txt:/app/prompt.txt:ro
      - ./agent-cco/config.yaml:/app/config.yaml:ro
    environment:
      CONFIG_PATH: /app/config.yaml
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      LM_STUDIO_URL: http://host.docker.internal:1234
      POSTGREST_URL: http://postgrest:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openbrain_pgdata:
  openbrain_ollama:
  openbrain_mqtt:

