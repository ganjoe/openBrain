# Open Brain - Local Self-Hosted Stack
# All services run locally, no external API dependencies.
#
# Services:
#   db            - PostgreSQL 17 + pgvector (vector database)
#   postgrest     - REST API layer (Supabase-compatible)
#   studio        - Supabase Studio Web UI
#   meta          - pg-meta backend for Studio
#   (Ollama/Embeddings: siehe llm-gateway-Projekt)
#   gateway       - Nginx proxy to handle /rest/v1 paths
#   nexus-broker  - Mosquitto MQTT broker (inter-agent bus)
#   web-scraper   - Playwright headless browser for CCO tooling
#
# Die MCP-Server und Agent-Bots (mcp-*, agent-*-bot) laufen seit dem Umzug
# nicht mehr in diesem Stack, sondern im llm-gateway-Projekt (~/QJM/llm-gateway).
# Die Service-Definitionen wurden am 2026-11-11 entfernt, damit ein
# "docker compose up" sie nicht wiederbelebt.

services:
  # --- PostgreSQL with pgvector ---
  db:
    image: pgvector/pgvector:pg17
    container_name: openbrain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - openbrain_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- PostgREST: REST API for the database ---
  postgrest:
    image: postgrest/postgrest
    container_name: openbrain-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
    ports:
      - "3001:3000"

  # --- Supabase Studio Web UI ---
  studio:
    image: supabase/studio:latest
    container_name: openbrain-studio
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: "Open Brain Local"
      DEFAULT_PROJECT_NAME: "open-brain"
      SUPABASE_URL: http://postgrest:3000
      SUPABASE_PUBLIC_URL: http://${SERVER_IP}:8001
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: "true"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    ports:
      - "3000:3000"

  # --- pg-meta for Studio ---
  meta:
    image: supabase/postgres-meta:v0.96.4
    container_name: openbrain-meta
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: ${POSTGRES_USER}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  # --- Gateway: Nginx proxy for /rest/v1 paths ---
  gateway:
    image: nginx:alpine
    container_name: openbrain-gateway
    restart: unless-stopped
    volumes:
      - ./core/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest
    ports:
      - "8001:80"


  # --- The Nexus: MQTT Broker (Mosquitto) ---
  nexus-broker:
    image: eclipse-mosquitto:2
    container_name: openbrain-nexus-broker
    restart: unless-stopped
    volumes:
      - ./nexus/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - openbrain_mqtt:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  web-scraper:
    build:
      context: ./core/web-scraper
      dockerfile: Dockerfile
    container_name: openbrain-web-scraper
    restart: unless-stopped
    volumes:
      - openbrain_reports:/data/reports
      - ./core/web-scraper/sources.yaml:/app/sources.yaml:ro
    environment:
      PORT: "8797"
      REPORTS_DIR: /data/reports
    ports:
      - "8797:8797"


volumes:
  openbrain_pgdata:
  openbrain_mqtt:
  openbrain_reports:

# Embeddings laufen ebenfalls im llm-gateway-Projekt (llm-gw-ollama-cpu).
# Das dort genutzte Volume heisst openbrain_openbrain_ollama und wird hier
# bewusst nicht mehr deklariert: "docker compose down -v" in diesem Verzeichnis
# wuerde sonst die Modelle des laufenden Stacks mitloeschen.
