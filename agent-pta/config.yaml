# Personal Trade Assistant — Nexus Agent Configuration
# Agent identity is defined ONLY here. Never hardcode IDs in source code.

agent:
  id: "pta"
  name: "Personal Trade Assistant"
  display_name: "PTA"

mqtt:
  broker_url: "mqtt://nexus-broker:1883"
  # Topics are derived from agent.id at runtime — do not hardcode here
  lwt_topic: "agents/status"
  lwt_payload: '{"agent":"pta","status":"offline","unix":0}'

mcp:
  # Local MCP servers this agent can call directly via HTTP
  local_servers:
    - url: "http://mcp-pta:8789"
      label: "openbrain-pta-execution"
    - url: "http://mcp-drawio:8795"
      label: "drawio-diagrams"
