<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCA Chart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 6px 12px;
      background: #0a0a0f;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }

    #ticker-label {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #f1f5f9;
    }

    #view-label {
      font-size: 0.75rem;
      color: #475569;
    }

    #ws-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      margin-left: auto;
      transition: background 0.3s;
    }

    #ws-dot.connected {
      background: #22c55e;
    }

    #stats-bar {
      display: flex;
      gap: 1.5rem;
      padding: 4px 12px;
      background: #0a0a0f;
      border-bottom: 1px solid #1a2133;
      flex-shrink: 0;
      font-size: 0.75rem;
      color: #64748b;
      font-family: monospace;
    }

    .stat {
      display: flex;
      gap: 0.4rem;
    }

    .stat-v {
      color: #94a3b8;
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Watchlist table view */
    #table-view {
      display: none;
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead th {
      background: #0a0a0f;
      color: #64748b;
      padding: 8px 12px;
      text-align: right;
      font-weight: 500;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
    }

    thead th:first-child {
      text-align: left;
    }

    tbody tr {
      cursor: pointer;
      border-bottom: 1px solid #0f172a;
      transition: background 0.1s;
    }

    tbody tr:hover {
      background: #1e293b;
    }

    tbody tr.active {
      background: #1e3a5f;
    }

    tbody td {
      padding: 7px 12px;
      text-align: right;
      color: #94a3b8;
    }

    tbody td:first-child {
      text-align: left;
      color: #e2e8f0;
      font-weight: 600;
    }

    .badge-green {
      color: #22c55e;
    }

    .badge-red {
      color: #ef4444;
    }

    /* Stats panel view */
    #stats-view {
      display: none;
      flex: 1;
      padding: 1.5rem;
      gap: 1rem;
      flex-direction: column;
      overflow-y: auto;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.85rem;
    }

    .kv-k {
      color: #64748b;
    }

    .kv-v {
      color: #e2e8f0;
      font-family: monospace;
      font-weight: 600;
    }

    .kv-v.green {
      color: #22c55e;
    }

    .kv-v.red {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <div id="header">
    <span id="ticker-label">—</span>
    <span id="view-label"></span>
    <div id="ws-dot"></div>
  </div>
  <div id="stats-bar"></div>

  <!-- Canvas chart view (candle_volume / bar_chart) -->
  <div id="canvas-wrap">
    <canvas id="chart"></canvas>
  </div>

  <!-- Watchlist table view -->
  <div id="table-view">
    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="stats-view"></div>

  <script src="/js/canvas_renderer.js?v=qmaggi-v1"></script>
  <script src="/js/ws_client.js?v=qmaggi-v1"></script>
  <script>
    // ─── URL parameters ──────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const LAYOUT = params.get('layout') || 'desktop';
    const VIEW_ID = params.get('view_id') || 'v1';
    const VIEW_TYPE = params.get('type') || 'candle_volume';

    const PCA_API = `http://${location.hostname}:8791`;

    // ─── UI refs ─────────────────────────────────────────────
    const tickerLabel = document.getElementById('ticker-label');
    const viewLabel = document.getElementById('view-label');
    const statsBar = document.getElementById('stats-bar');
    const wsDot = document.getElementById('ws-dot');
    const canvasWrap = document.getElementById('canvas-wrap');
    const tableView = document.getElementById('table-view');
    const statsView = document.getElementById('stats-view');

    viewLabel.textContent = `[${VIEW_ID} · ${VIEW_TYPE}]`;

    // ─── State ───────────────────────────────────────────────
    let layoutConfig = null;
    let viewConfig = null;
    let renderer = null;
    let currentSymbol = null;
    let hasInitializedSymbol = false;
    let cachedWatchlistTickers = [];

    // ─── Layout config fetch ─────────────────────────────────
    async function fetchLayoutConfig() {
      const r = await fetch(`${PCA_API}/api/layouts/${LAYOUT}`);
      const layout = await r.json();
      layoutConfig = layout.config;
      viewConfig = layout.config.views.find(v => v.view_id === VIEW_ID);
      return viewConfig;
    }

    // ─── Data load ───────────────────────────────────────────
    async function loadTicker(symbol) {
      if (!hasInitializedSymbol && viewConfig?.symbol) {
        symbol = viewConfig.symbol;
        hasInitializedSymbol = true;
      } else if (hasInitializedSymbol && viewConfig?.symbol) {
        // Allow the ticker to change dynamically after initial load
        // instead of staying hardcoded.
      } else if (!hasInitializedSymbol) {
        hasInitializedSymbol = true;
      }

      if (!symbol) return;
      const upperSymbol = symbol.toUpperCase();
      if (currentSymbol === upperSymbol) return;
      currentSymbol = upperSymbol;
      tickerLabel.textContent = currentSymbol;

      if (VIEW_TYPE === 'watchlist_table') {
        await loadWatchlistTable(viewConfig);
        return;
      }
      if (VIEW_TYPE === 'stats_panel') {
        if (!viewConfig) return;
        await loadStatsPanel(currentSymbol, viewConfig);
        return;
      }

      // Chart types: candle_volume | bar_chart
      const tf = viewConfig?.timeframe ?? '1D';
      const limit = viewConfig?.bar_count ?? 2000;

      try {
        const chartPromise = fetch(`${PCA_API}/api/chartdata?symbol=${currentSymbol}&timeframe=${tf}&limit=${limit}`).then(r => r.json());
        const indicatorPromises = [];
        const apiInds = (viewConfig && viewConfig.indicators) ? viewConfig.indicators.filter(i => i.source === 'api') : [];
        
        if (apiInds.length > 0) {
          const FEATURES_API = `http://${location.hostname}:8003/features`;
          for (const ind of apiInds) {
            if (ind.type === 'ma') {
              const reqBody = {
                ticker: currentSymbol,
                chart_timeframe: tf,
                ma_type: ind.params.ma_type.toUpperCase(),
                ma_window: ind.params.window
              };
              const p = fetch(`${FEATURES_API}/ma`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reqBody)
              }).then(r => r.ok ? r.json() : null).then(featureData => ({ ind, featureData })).catch(e => {
                console.error('Failed to fetch dynamic feature:', ind, e);
                return null;
              });
              indicatorPromises.push(p);
            }
          }
        }

        const [data, ...indResults] = await Promise.all([chartPromise, ...indicatorPromises]);

        if (indResults.length > 0) {
          for (const res of indResults) {
            if (!res || !res.featureData) continue;
            const { ind, featureData } = res;
            const label = featureData.ma_label;
            
            data.columns.push(label);
            ind.column = label; // tell renderer which column to use
            
            const featDict = {};
            featureData.timestamps.forEach((ts, idx) => {
              featDict[ts] = featureData.values[idx];
            });
            
            const tsIndex = data.columns.indexOf('timestamp');
            data.data.forEach(row => {
              const ts = row[tsIndex];
              row.push(featDict[ts] ?? null);
            });
          }
        }

        if (!renderer) initRenderer();
        renderer.loadData(data);
        updateStatsBar(data);
      } catch (e) {
        console.error('Data load failed:', e);
      }
    }

    // ─── Canvas renderer init ────────────────────────────────
    function initRenderer() {
      const canvas = document.getElementById('chart');
      renderer = new ChartRenderer(canvas, viewConfig || { type: VIEW_TYPE, indicators: [], volume: { enabled: false } });
      new ResizeObserver(() => renderer.resize()).observe(canvas.parentElement);
    }

    // ─── Watchlist table ─────────────────────────────────────
    async function loadWatchlistTable(cfg) {
      canvasWrap.style.display = 'none';
      tableView.style.display = 'block';
      const cols = cfg?.columns ?? [{ key: 'ticker', label: 'Ticker' }];
      const watchlist = layoutConfig?.watchlist ?? LAYOUT;

      const r = await fetch(`${PCA_API}/api/watchlists/${watchlist}`);
      const data = await r.json();

      if (data.tickers) {
        cachedWatchlistTickers = data.tickers.map(t => t.ticker);
      }

      document.getElementById('table-head').innerHTML =
        `<tr>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr>`;

      const rows = await Promise.all(data.tickers.map(async ({ ticker }) => {
        // Get latest close and feature values from chart data (last 1 bar)
        try {
          const cr = await fetch(`${PCA_API}/api/chartdata?symbol=${ticker}&timeframe=1D&limit=1`);
          if (!cr.ok) return { ticker, row: [], ci: {} };
          const cd = await cr.json();
          if (!cd || !cd.columns || !cd.data || !cd.data.length) return { ticker, row: [], ci: {} };
          const ci = Object.fromEntries(cd.columns.map((c, i) => [c, i]));
          const row = cd.data[0] ?? [];
          return { ticker, row, ci };
        } catch { return { ticker, row: [], ci: {} }; }
      }));

      document.getElementById('table-body').innerHTML = rows.map(({ ticker, row, ci }) => {
        const cells = cols.map(c => {
          if (c.key === 'ticker') return `<td>${ticker}</td>`;
          const i = ci[c.key];
          let v = i !== undefined ? row[i] : '—';
          if (c.key === 'minervini_trend_template') {
            v = v ? '<span class="badge-green">✓</span>' : '<span class="badge-red">✗</span>';
          } else if (typeof v === 'number') {
            v = v.toFixed(c.key === 'close' ? 2 : 0);
          }
          return `<td>${v ?? '—'}</td>`;
        });
        return `<tr onclick="loadTickerCmd('${ticker}')">${cells.join('')}</tr>`;
      }).join('');
    }

    // ─── Stats panel ─────────────────────────────────────────
    async function loadStatsPanel(symbol, cfg) {
      canvasWrap.style.display = 'none';
      statsView.style.display = 'flex';
      const fields = cfg?.fields ?? [];
      try {
        const r = await fetch(`${PCA_API}/api/chartdata?symbol=${symbol}&timeframe=1D&limit=1`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const cd = await r.json();
        if (!cd || !cd.columns || !cd.data || !cd.data.length) throw new Error('No data returned');
        const ci = Object.fromEntries(cd.columns.map((c, i) => [c, i]));
        const row = cd.data[0] ?? [];
        statsView.innerHTML = fields.map(f => {
          let v = ci[f] !== undefined ? row[ci[f]] : '—';
          let cls = '';
          if (f === 'minervini_trend_template') {
            cls = v ? 'green' : 'red';
            v = v ? '✓ Trend Template' : '✗ kein Template';
          } else if (typeof v === 'number') {
            v = v.toFixed(2);
          }
          return `<div class="kv"><span class="kv-k">${f}</span><span class="kv-v ${cls}">${v}</span></div>`;
        }).join('');
      } catch (e) {
        statsView.innerHTML = `<div style="color:#ef4444">Fehler: ${e.message}</div>`;
      }
    }

    // ─── Stats bar (top) ─────────────────────────────────────
    function updateStatsBar(data) {
      const ci = Object.fromEntries(data.columns.map((c, i) => [c, i]));
      const row = data.data[data.data.length - 1];
      if (!row) return;
      const fmt = (k, dec = 2) => ci[k] !== undefined ? (+row[ci[k]]).toFixed(dec) : '—';
      statsBar.innerHTML = [
        ['Close', fmt('close')],
        ['O', fmt('open')],
        ['H', fmt('high')],
        ['L', fmt('low')],
        ['Vol', ci['volume'] !== undefined ? Math.round(row[ci['volume']]).toLocaleString() : '—'],
        ['RS', fmt('ibd_rs', 0)],
        ['M', fmt('minervini_score', 0)],
      ].map(([k, v]) => `<div class="stat"><span>${k}</span><span class="stat-v">${v}</span></div>`).join('');
    }

    // ─── Crosshair sync ──────────────────────────────────────
    document.addEventListener('pca:crosshair', (e) => {
      wsClient?.broadcastCrosshair(e.detail.barIndex, e.detail.price);
    });

    // ─── Keyboard & Swipe: Ticker-Navigation ─────────────────
    function navigateWatchlist(dir) {
      if (!currentSymbol) return;
      if (cachedWatchlistTickers.length > 0) {
        let idx = cachedWatchlistTickers.indexOf(currentSymbol);
        if (idx === -1) idx = 0;
        else {
          idx += (dir === 'next' ? 1 : -1);
          if (idx < 0) idx = cachedWatchlistTickers.length - 1;
          if (idx >= cachedWatchlistTickers.length) idx = 0;
        }
        const nextSymbol = cachedWatchlistTickers[idx];
        loadTicker(nextSymbol);
        wsClient?.sendCommand('load_ticker', { symbol: nextSymbol });
      } else {
        const cmd = dir === 'next' ? 'next_in_watchlist' : 'prev_in_watchlist';
        const watchlist = layoutConfig?.watchlist || LAYOUT;
        wsClient?.sendCommand(cmd, { current_ticker: currentSymbol, watchlist: watchlist });
      }
    }

    document.addEventListener('pca:ticker_swipe', (e) => navigateWatchlist(e.detail.dir));

    document.addEventListener('keydown', (e) => {
      // Ignore if user is typing in an input or textarea
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        navigateWatchlist('next');
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        navigateWatchlist('prev');
      }
    });

    // ─── WS client ───────────────────────────────────────────
    let wsClient;

    async function init() {
      await fetchLayoutConfig();
      // Load default first ticker from watchlist
      let defaultSymbol = 'NVDA';
      if (layoutConfig && layoutConfig.watchlist) {
        try {
          const r = await fetch(`${PCA_API}/api/watchlists/${layoutConfig.watchlist}`);
          const wl = await r.json();
          if (wl.tickers && wl.tickers.length > 0) {
            cachedWatchlistTickers = wl.tickers.map(t => t.ticker);
            defaultSymbol = wl.tickers[0].ticker;
          }
        } catch (e) {
          console.warn("Failed to load layout watchlist, falling back to NVDA");
        }
      }
      await loadTicker(defaultSymbol);

      wsClient = new PcaWsClient(
        (symbol) => loadTicker(symbol),                             // on ticker change
        (idx, price) => renderer?.setCrosshairFromRemote(idx, price), // on crosshair sync
        (list_name) => {                                            // on watchlist change
          if (layoutConfig) layoutConfig.watchlist = list_name;
          if (VIEW_TYPE === 'watchlist_table') {
            loadWatchlistTable(viewConfig);
          }
        }
      );

      document.addEventListener('pca:ws:connected', () => wsDot.classList.add('connected'));
      document.addEventListener('pca:ws:disconnected', () => wsDot.classList.remove('connected'));
    }

    // Helper for watchlist table click
    function loadTickerCmd(symbol) {
      wsClient?.sendCommand('load_ticker', { symbol });
      loadTicker(symbol);
    }

    init().catch(console.error);
  </script>
</body>

</html>
