<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCA Master</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
      padding: 2rem;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: #64748b;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      transition: background 0.3s;
    }
    .dot.connected { background: #22c55e; }
    h1 { font-size: 1.5rem; color: #f1f5f9; letter-spacing: 0.05em; font-weight: 700; }
    .layout-grid {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
      margin: 1.5rem 0;
    }
    .layout-card {
      background: #11111b;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1.2rem;
      width: 280px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }
    .layout-card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
      background: #181825;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
    }
    .wl-card {
      background: #11111b;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1.2rem;
      width: 280px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }
    .wl-card:hover {
      transform: translateY(-2px);
      border-color: #8b5cf6;
      background: #1e1b4b;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.15);
    }
    .layout-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: capitalize;
    }
    .badge {
      font-size: 0.65rem;
      background: #2563eb;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .layout-desc {
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.4;
      flex-grow: 1;
    }
    .log {
      font-size: 0.75rem;
      color: #475569;
      font-family: monospace;
      max-width: 500px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>PCA · Master Coordinator</h1>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Verbindung aufbauen…</span>
  </div>

  <h2>Layouts</h2>
  <div class="layout-grid" id="layout-container">
    <div style="color: #64748b">Layouts werden geladen...</div>
  </div>

  <h2>Watchlists</h2>
  <div class="layout-grid" id="watchlist-container">
    <div style="color: #64748b">Watchlists werden geladen...</div>
  </div>

  <div class="log" id="log">Warte auf Befehle…</div>

  <script>
    const PCA_WS = `ws://${location.hostname}:8791/ws?master=true`;
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const logEl = document.getElementById('log');
    const layoutContainer = document.getElementById('layout-container');
    const watchlistContainer = document.getElementById('watchlist-container');

    // Child window tracking: view_id -> window ref
    const childWindows = {};
    let currentLayoutName = null;

    let ws;

    function log(msg) {
      logEl.textContent = msg;
      console.log('[Master]', msg);
    }

    function connect() {
      ws = new WebSocket(PCA_WS);

      ws.onopen = () => {
        dot.classList.add('connected');
        statusText.textContent = 'Verbunden mit PCA Service';
        log('Bereit. Warte auf Layout-Befehle.');
      };

      ws.onclose = () => {
        dot.classList.remove('connected');
        statusText.textContent = 'Verbindung getrennt — Reconnect in 3s…';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        statusText.textContent = 'Verbindungsfehler';
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleMessage(msg);
        } catch (e) {
          console.error('Invalid message:', event.data);
        }
      };
    }

    function handleMessage(msg) {
      log(`Befehl empfangen: ${msg.action}`);

      if (msg.action === 'open_layout') {
        openLayoutFromConfig(msg.layout_name, msg.config);
      } else if (msg.action === 'load_ticker') {
        // Forward to all child windows via BroadcastChannel
        const bc = new BroadcastChannel('pca_sync');
        bc.postMessage({ action: 'load_ticker', symbol: msg.symbol });
        bc.close();
      }
    }

    async function loadLayouts() {
      try {
        const r = await fetch(`http://${location.hostname}:8791/api/layouts`);
        const data = await r.json();
        if (!data.layouts || data.layouts.length === 0) {
          layoutContainer.innerHTML = '<div style="color: #64748b">Keine Layouts in der Datenbank.</div>';
          return;
        }
        layoutContainer.innerHTML = data.layouts.map(l => {
          const badge = l.is_default ? '<span class="badge">Default</span>' : '';
          return `
            <div class="layout-card" onclick="openLayout('${l.name}')">
              <div class="layout-name">
                <span>${l.name}</span>
                ${badge}
              </div>
              <div class="layout-desc">${l.description || 'Keine Beschreibung.'}</div>
            </div>
          `;
        }).join('');
      } catch (e) {
        log(`Fehler beim Layout-Abruf: ${e.message}`);
        layoutContainer.innerHTML = `<div style="color: #ef4444">Fehler beim Laden: ${e.message}</div>`;
      }
    }

    async function loadWatchlists() {
      try {
        const r = await fetch(`http://${location.hostname}:8791/api/watchlists`);
        const data = await r.json();
        if (!data.watchlists || data.watchlists.length === 0) {
          watchlistContainer.innerHTML = '<div style="color: #64748b">Keine Watchlists in der Datenbank.</div>';
          return;
        }
        watchlistContainer.innerHTML = data.watchlists.map(name => `
          <div class="wl-card" onclick="openWatchlist('${name}')">
            <div class="layout-name">
              <span>${name}</span>
            </div>
            <div class="layout-desc">Liste aktivieren</div>
          </div>
        `).join('');
      } catch (e) {
        log(`Fehler beim Watchlist-Abruf: ${e.message}`);
        watchlistContainer.innerHTML = `<div style="color: #ef4444">Fehler beim Laden: ${e.message}</div>`;
      }
    }

    async function openWatchlist(listName) {
      if (!currentLayoutName) {
        log('Achtung: Bitte wähle zuerst ein Layout aus!');
        return;
      }
      try {
        const res = await fetch(`http://${location.hostname}:8791/api/command`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'load_watchlist',
            payload: { list_name: listName, layout_name: currentLayoutName }
          })
        });
        if (!res.ok) throw new Error('API Fehler: ' + res.status);
        log(`Watchlist '${listName}' in Layout '${currentLayoutName}' geladen.`);
      } catch (e) {
        log(`Fehler beim Setzen der Watchlist: ${e.message}`);
      }
    }

    function openLayout(layoutName) {
      // Manual button: fetch layout config from the service, then open windows
      fetch(`http://${location.hostname}:8791/api/layouts/${layoutName}`)
        .then(r => r.json())
        .then(layout => openLayoutFromConfig(layoutName, layout.config))
        .catch(e => log(`Fehler beim Öffnen des Layouts: ${e.message}`));
    }

    function openLayoutFromConfig(layoutName, config) {
      if (!config || !config.views) {
        log(`Ungültige Layout-Konfiguration für: ${layoutName}`);
        return;
      }

      currentLayoutName = layoutName;
      log(`Öffne Layout: ${layoutName} (${config.views.length} Fenster)`);

      // Calculate window positions based on grid and screen size
      const cols = config.grid?.cols || 2;
      const rows = config.grid?.rows || 2;
      const winW = Math.floor(screen.availWidth / cols);
      const winH = Math.floor(screen.availHeight / rows);

      config.views.forEach(view => {
        const col = view.grid_pos?.col ?? 0;
        const row = view.grid_pos?.row ?? 0;
        const left = col * winW;
        const top = row * winH;

        const params = new URLSearchParams({
          layout: layoutName,
          view_id: view.view_id,
          type: view.type,
        });
        const url = `/chart.html?${params}`;
        const features = `width=${winW},height=${winH},left=${left},top=${top},menubar=no,toolbar=no,location=no`;

        // Reuse existing window if already open
        const existing = childWindows[view.view_id];
        if (existing && !existing.closed) {
          existing.focus();
        } else {
          childWindows[view.view_id] = window.open(url, `pca_${view.view_id}`, features);
        }
      });
    }

    connect();
    loadLayouts();
    loadWatchlists();
  </script>
</body>
</html>
