server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index master.html;

    # Redirect root to master.html
    location = / {
        return 302 /master;
    }

    # Serve files: try exact match, then with .html extension, then 404
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Proxy WebSocket upgrades to the PCA service
    location /ws {
        proxy_pass http://agent-pca-service:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
