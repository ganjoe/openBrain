server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index master.html;

    # Serve all static files with cache control
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Proxy WebSocket upgrades to the PCA service
    # (browser can also connect directly to :8791, this is for same-origin convenience)
    location /ws {
        proxy_pass http://agent-pca-service:8791;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
